services:

  master:
    image: mysql:8.4
    container_name: mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
    volumes:
      - master_data:/var/lib/mysql
    networks:
      - replication-net

  replica1:
    image: mysql:8.4
    container_name: mysql-replica1
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3308:3306"
    command:
      - --server-id=2
      - --relay-log=relay-bin
      - --log-bin=mysql-bin
      - --log-replica-updates=ON
    volumes:
      - replica1_data:/var/lib/mysql
    networks:
      - replication-net

  replica2:
    image: mysql:8.4
    container_name: mysql-replica2
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3309:3306"
    command:
      - --server-id=3
      - --relay-log=relay-bin
      - --log-bin=mysql-bin
      - --log-replica-updates=ON
    volumes:
      - replica2_data:/var/lib/mysql
    networks:
      - replication-net

networks:
  replication-net:
    driver: bridge

volumes:
  master_data:
  replica1_data:
  replica2_data: